<style>

</div>
<script>
window.__sceneTweens = window.__sceneTweens || [];
window.__sceneTweens.push(function (tl) {

    tl.fromTo(".sub", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: .26 }, 1.28);
    tl.fromTo(".btn", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: .26, ease: "back.out(2)" }, 1.46);

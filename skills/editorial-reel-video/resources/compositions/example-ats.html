<!--
  _scene-base.html.tmpl — the v6 scene skeleton. Never rendered, never mounted: it is the template
  that scripts/new_scene.py copies. Every colour, size and position below is a var() from the
  generated token block — there is not one literal #hex or px value in this file, so changing
  PARAMS.json really does change every scene.

  STRUCTURE — the bottom half is invariant, the top half is free:
     anchors 1 kicker · 2 hero · 3 body · 4 chip · 5 presenter
     the body (anchor 3) is the only thing that changes shape. Pick ONE archetype per scene:
       A card-led   hero + a real UI panel   (proof beats: terminal, diff, dashboard, mockup)
       B stat-led   hero + odometer + line   (number beats: 437 lines, 89x faster)
       C type-led   hero + 2 lines, no card  (statement, CTA, transition)
  Markers  let new_scene.py delete the ones you did not pick.
-->
<template>
  <style>
    /* @tokens:start — generated by scripts/prepare.py from PARAMS.json. Do not edit by hand. */
:root {
  --w: 1080px; --h: 1920px;
  --ground: #EDE3D6; --ink: #0C0A0B;
  --accent: #6F0017; --secondary: #CEDBD1;
  --tertiary: #0A172A; --quaternary: #DCD5E1;
  --on-ink: #EDE3D6; --on-accent: #EDE3D6;
  --on-tertiary: #EDE3D6; --on-quaternary: #0C0A0B;
  --paper: #FFFDF8; --paper-ink: #16110F; --paper-muted: #7A6B60; --paper-bar: #F1E9DC;
  --font-display: "Anton"; --font-slab: "Archivo Black"; --font-mono: "Space Mono";

  --margin-x: 60.5px;
  --kicker-top: 128.1px;
  --hero-top: 193.2px;
  --card-top: 577.9px;
  --card-w: 960.0px;
  --card-h: 470.4px;
  --card-radius: 16px;
  --chip-top: 1128.0px;
  --chip-h: 86.0px;
  --chip-radius: 999px;
  --chip-pad: 38.0px;
  --presenter-top: 1217.3px;
  --presenter-h: 794.9px;
  --presenter-x: 223.6px;

  --size-hero: 180px;
  --odo-step: 180px;  /* one digit cell = 1em at --size-hero, so '5em' is exactly 5 digits */
  --hero-lines: 2;          /* how many lines fit — do not exceed */
  --hero-band: 316.6px;
  --gap: 48.00px;
  --size-hero-max: 270px;
  --size-kicker: 32.4px;
  --size-chip: 36.0px;
  --size-body: 28.1px;
  --lh-display: 0.88;
  --tracking-label: 0.2em;
  --halftone: 0.1;
  /* chrome — derived from W so a 4:5 or 720x1280 render keeps the same proportions.
     Not in PARAMS.json: nobody should be hand-tuning these. */
  --border-w: 3.0px;
  --dot-pitch: 7.0px;
  --dot-r: 1.10px;
  --bar-h: 62.0px;
  --bar-pad: 22.0px;
  --bar-gap: 14.0px;
  --card-pad: 24.0px;
  --dash-w: 46.0px;
  --dash-h: 5.0px;
  --dash-gap: 18.0px;
  --glow: 699.8px;
  --glow-alpha: 0.20;
  --hard-shadow: 14px 16px 0;
  --safe-top: 8.75%;
  --safe-bottom: 78.10%;
}
/* @tokens:end */

    @font-face { font-family: "Anton"; src: url("../assets/fonts/Anton-Regular.ttf"); }
    @font-face { font-family: "Archivo Black"; src: url("../assets/fonts/ArchivoBlack-Regular.ttf"); }
    @font-face { font-family: "Space Mono"; src: url("../assets/fonts/SpaceMono-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Space Mono"; src: url("../assets/fonts/SpaceMono-Bold.ttf"); font-weight: 700; }

    #root { position: absolute; inset: 0; overflow: hidden;
      font-family: var(--font-mono); -webkit-font-smoothing: antialiased; }

    /* The background field is chosen by ONE attribute, never by a literal colour.
       prepare.py reads data-field on every scene and refuses two in a row on the same field. */
    #root[data-field="secondary"]    { background: var(--ground);    color: var(--ink); }
    #root[data-field="accent"]    { background: var(--accent);    color: var(--on-accent); }
    #root[data-field="ink"]       { background: var(--ink);       color: var(--on-ink); }
    #root[data-field="secondary"]  { background: var(--secondary);  color: var(--ink); }
    #root[data-field="tertiary"]   { background: var(--tertiary);   color: var(--on-tertiary); }
    #root[data-field="quaternary"] { background: var(--quaternary); color: var(--on-quaternary); }

    .dots { position: absolute; inset: 0; opacity: var(--halftone); color: currentColor;
      background-image: radial-gradient(currentColor var(--dot-r), transparent calc(var(--dot-r) + .1px));
      background-size: var(--dot-pitch) var(--dot-pitch); }

    /* ---- ANCHOR 1 · kicker ---- */
    .kicker { position: absolute; left: var(--margin-x); top: var(--kicker-top);
      font-size: var(--size-kicker); font-weight: 700;
      letter-spacing: var(--tracking-label); text-transform: uppercase; opacity: 0; }
    .kicker i { display: inline-block; width: var(--dash-w); height: var(--dash-h); background: var(--accent);
      vertical-align: middle; margin-right: var(--dash-gap); }
    #root[data-field="accent"] .kicker i { background: var(--on-accent); }
    #root[data-field="tertiary"] .kicker i { background: var(--accent); }

    /* ---- ANCHOR 2 · hero. The band is --hero-band tall and fits --hero-lines lines. ---- */
    .disp { font-family: var(--font-display); text-transform: uppercase;
            line-height: var(--lh-display); letter-spacing: -.01em; }
    #s2-hero { position: absolute; left: var(--margin-x); top: var(--hero-top);
      font-size: var(--size-hero); opacity: 0; max-width: 92%; }

    /* ---- ANCHOR 3A · card (archetype A) ---- */
    
    /* ---- ANCHOR 3B · stat (archetype B) ---- */
        #s2-odo { position: absolute; left: var(--margin-x); top: var(--card-top); display: flex; opacity: 0; }
    /* one cell is EXACTLY 1em (em = --size-hero), so the strips can be moved in whole-digit steps */
    /* font-size lives on the column so 1em === one digit cell (do not move this to the span only) */
    #s2-odo .col { font-size: 1em; width: calc(var(--size-hero) * .58); height: var(--size-hero); overflow: hidden; }
    #s2-odo .col .strip { display: block; }               /* MUST be block — transform dies on inline */
    #s2-odo .col .strip span { display: block; height: 1em; line-height: 1em; text-align: center;
      font-family: var(--font-display); font-size: var(--size-hero); color: var(--accent); }
    #s2-odo { font-size: var(--size-hero); }
    #root[data-field="accent"] #s2-odo .col .strip span { color: var(--on-accent); }
    #s2-support { position: absolute; left: var(--margin-x); top: calc(var(--card-top) + var(--size-hero) * 1.08);
      font-size: var(--size-body); opacity: 0; max-width: 80%; line-height: 1.45; }
    
    /* ---- ANCHOR 3C · type-only body (archetype C) ---- */
    
    /* ---- ANCHOR 4 · chip. INVARIANT: same place in every scene, and it never overlaps the card. ---- */
    #s2-chip { position: absolute; left: var(--margin-x); top: var(--chip-top); height: var(--chip-h);
      display: flex; align-items: center; gap: calc(var(--bar-gap) * 1.4); padding: 0 var(--chip-pad);
      border-radius: var(--chip-radius); background: var(--ink); color: var(--on-ink);
      font-size: var(--size-chip); font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; opacity: 0; }
    #s2-chip b { width: calc(var(--chip-h) * .19); height: calc(var(--chip-h) * .19);
      border-radius: 50%; background: var(--accent); display: block; }
    #root[data-field="ink"] #s2-chip { background: var(--accent); color: var(--on-accent); }
    #root[data-field="ink"] #s2-chip b { background: var(--on-accent); }

    /* ---- ANCHOR 5 · presenter. INVARIANT: same place, cropped by the frame, never slides. ---- */
    #s2-char { position: absolute; left: var(--presenter-x); top: var(--presenter-top);
      width: calc(var(--w) - var(--presenter-x)); height: var(--presenter-h); opacity: 0; }
    #s2-char img { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; }
    #s2-glow { position: absolute; left: var(--presenter-x); top: var(--presenter-top);
      width: var(--glow); height: var(--glow); border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, color-mix(in srgb, currentColor calc(var(--glow-alpha) * 100%), transparent) 0%, transparent 70%); }
    /* a dark hoodie on a dark field disappears: the halo carries the silhouette */
    #root[data-field="ink"], #root[data-field="tertiary"] { --glow-alpha: 0.42; }
  </style>

  <script>window.__sceneTweens = window.__sceneTweens || [];</script>
  <div id="root" data-composition-id="s2-ats" data-cover="0" data-field="secondary" data-width="1080" data-height="1920">
    <div class="dots"></div>
    <div id="s2-glow"></div>

    <div class="kicker" id="s2-kicker"><i></i>bonus check</div>
    <div class="disp" id="s2-hero">ats score</div>

    
        <!-- one .col per digit, left to right. data-digit is the number it lands on;
         scripts/new_scene.py --digits 94 rebuilds this block for you. -->
    <div id="s2-odo">
      <div class="col" data-digit="9"><span class="strip"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span></div>
      <div class="col" data-digit="4"><span class="strip"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></span></div>
    </div>
    <div id="s2-support">keywords add karo, score dekho, dobara check karo</div>
    
    
    <div id="s2-chip"><b></b>score dekho</div>
    <div id="s2-char"><img src="../assets/presenter/cut/p6_thumbs.png" /></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    /* FRAME 0 IS THE COVER. Scene 1 (data-cover="1") is already composed at t=0, so the reel opens on a
       poster instead of an empty field. Every other scene enters from nothing. That is the ONLY difference
       between the two cases — so the tweens below are authored once and only their timings move. */
    const cover = document.getElementById("root").dataset.cover === "1";
    const bodyAt = cover ? 0.05 : 0.45;   /* on the cover the card is part of the poster */
    if (cover) gsap.set(["#s2-kicker", "#s2-hero", "#s2-char", "#s2-glow"],
                        { opacity: 1, x: 0, y: 0, scale: 1 });

    tl.fromTo("#s2-kicker", { y: cover ? 0 : -26, opacity: cover ? 1 : 0 },
                            { y: 0, opacity: 1, duration: cover ? .01 : .32, ease: "power3.out" }, .04);
    tl.fromTo("#s2-hero", { scale: cover ? 1 : 1.3, y: cover ? 0 : 44, opacity: cover ? 1 : 0 },
                          { scale: 1, y: 0, opacity: 1, duration: cover ? .01 : .30, ease: "power4.out" }, .30);
    tl.fromTo("#s2-glow", { opacity: cover ? 1 : 0 }, { opacity: 1, duration: cover ? .01 : .45, ease: "power2.out" }, .30);
    tl.fromTo("#s2-char", { y: cover ? 0 : 46, scale: cover ? 1 : .92, opacity: cover ? 1 : 0 },
                          { y: 0, scale: 1, opacity: 1, duration: cover ? .01 : .34, ease: "power3.out" }, .34);

    /* #js:A */
    tl.fromTo("#s2-card", { y: 56, scale: .95, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .32, ease: "power3.out" }, bodyAt);
    /* /#js:A */

    /* #js:B */
    tl.fromTo("#s2-odo", { y: 56, opacity: 0 }, { y: 0, opacity: 1, duration: .32, ease: "power3.out" }, bodyAt);
    /* 1em === one digit cell, so the strip is moved by exactly as many em as the digit it must land on */
    document.querySelectorAll("#s2-odo .col").forEach((col, i) => {
      tl.to(col.querySelector(".strip"),
            { y: `-=${+col.dataset.digit || 0}em`, duration: 0.95 - i * 0.05, ease: "power2.inOut" },
            0.55 + i * 0.05);
    });
    tl.fromTo("#s2-support", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: "power2.out" }, 1.25);
    /* /#js:B */

    /* #js:C */
    tl.fromTo("#s2-lines", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: .30, ease: "power4.out" }, bodyAt);
    /* /#js:C */

    /* the chip is the caption: it lands on the word it captions, or early on the cover */
    tl.fromTo("#s2-chip", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .26, ease: "power3.out" },
              cover ? 0.65 : 0.18);

    tl.to("#s2-hero", { y: -14, duration: .7, ease: "power1.inOut" }, 5.2);

    /* per-scene tweens queued by the card markup (it parses before this script runs) */
    (window.__sceneTweens || []).forEach(function (fn) { try { fn(tl); } catch (e) { console.error(e); } });

    window.__timelines["s2-ats"] = tl;
  </script>
</template>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Cluster of stylized cherry blossoms (Sakura) -->
  <g opacity="0.88">
    <!-- Main Blossom 1 -->
    <g transform="translate(42, 42)">
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFB7C5" stroke="#E57373" stroke-width="1.2" transform="rotate(0)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFB7C5" stroke="#E57373" stroke-width="1.2" transform="rotate(72)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFB7C5" stroke="#E57373" stroke-width="1.2" transform="rotate(144)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFB7C5" stroke="#E57373" stroke-width="1.2" transform="rotate(216)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFB7C5" stroke="#E57373" stroke-width="1.2" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="4.5" fill="#C2185B"/>
      <!-- Pistils -->
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#AD1457" stroke-width="1" stroke-linecap="round"/>
      <circle cx="0" cy="-12" r="1.5" fill="#AD1457"/>
      <line x1="0" y1="0" x2="11" y2="-4" stroke="#AD1457" stroke-width="1" stroke-linecap="round"/>
      <circle cx="11" cy="-4" r="1.5" fill="#AD1457"/>
      <line x1="0" y1="0" x2="7" y2="10" stroke="#AD1457" stroke-width="1" stroke-linecap="round"/>
      <circle cx="7" cy="10" r="1.5" fill="#AD1457"/>
      <line x1="0" y1="0" x2="-7" y2="10" stroke="#AD1457" stroke-width="1" stroke-linecap="round"/>
      <circle cx="-7" cy="10" r="1.5" fill="#AD1457"/>
      <line x1="0" y1="0" x2="-11" y2="-4" stroke="#AD1457" stroke-width="1" stroke-linecap="round"/>
      <circle cx="-11" cy="-4" r="1.5" fill="#AD1457"/>
    </g>

    <!-- Smaller Blossom 2 -->
    <g transform="translate(95, 28) scale(0.68) rotate(25)">
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFC1CC" stroke="#E57373" stroke-width="1.2" transform="rotate(0)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFC1CC" stroke="#E57373" stroke-width="1.2" transform="rotate(72)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFC1CC" stroke="#E57373" stroke-width="1.2" transform="rotate(144)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFC1CC" stroke="#E57373" stroke-width="1.2" transform="rotate(216)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFC1CC" stroke="#E57373" stroke-width="1.2" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="4" fill="#C2185B"/>
    </g>

    <!-- Smaller Blossom 3 -->
    <g transform="translate(25, 95) scale(0.55) rotate(45)">
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFD1DC" stroke="#E57373" stroke-width="1.2" transform="rotate(0)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFD1DC" stroke="#E57373" stroke-width="1.2" transform="rotate(72)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFD1DC" stroke="#E57373" stroke-width="1.2" transform="rotate(144)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFD1DC" stroke="#E57373" stroke-width="1.2" transform="rotate(216)"/>
      <path d="M0,0 C-8,-18 8,-24 0,-34 C-8,-24 8,-18 0,0" fill="#FFD1DC" stroke="#E57373" stroke-width="1.2" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3.5" fill="#C2185B"/>
    </g>

    <!-- Floating Petals -->
    <path d="M125,70 C120,62 132,58 135,66 C138,74 128,76 125,70 Z" fill="#FFB7C5" transform="rotate(18 125 70)"/>
    <path d="M75,115 C70,108 80,104 84,110 C87,116 79,120 75,115 Z" fill="#FFC1CC" transform="rotate(-30 75 115)"/>
  </g>
</svg>
